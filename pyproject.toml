[project]
name = "ai-demo-dte"
version = "0.1.0"
description = "Agente de IA que procesa facturas electrónicas chilenas (DTE)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "pypdf>=5.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "fastmcp>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tablas de datos de prueba: líneas largas a propósito para leer cada caso en una fila.
"samples/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
