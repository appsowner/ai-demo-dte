  hechos_clave: [["mismo momento"], ["entrega"]]
  tipo: normal
  verificado_en: "dl825-ley-iva art. 55: 'las facturas deberán ser emitidas en el mismo momento en que se efectúe la entrega real o simbólica'"

- id: n13
