# Golden set del agente de normativa (fase 2, tarjeta 13).
#
# Escenario: Marcela, encargada de finanzas de una pyme, pregunta con sus palabras
# (no con las de la ley: si la pregunta copia el texto del documento, la búsqueda parece
# mejor de lo que es).
#
# Campos:
#   documentos_esperados: ids de normativa/docs que contienen la respuesta (basta con
#                         recuperar uno de ellos en el top-5 → recall@5).
#   hechos_clave:         lo que la respuesta DEBE decir. Cada elemento es una lista de
#                         alternativas equivalentes ("8 días" u "ocho días"): debe aparecer
#                         al menos una. Comparación sin mayúsculas ni tildes.
#   tipo:                 normal | fuera_del_corpus (respuesta correcta: decir que no sabe).
#   verificado_en:        dónde se comprobó el hecho (para revisar la pauta, no para el agente).
#
# Cada hecho fue verificado contra el texto descargado, no contra la memoria.

- id: n01
  pregunta: "Me llegó una factura de un proveedor y no la pagué al contado. ¿Qué tengo que hacer para poder usar el IVA como crédito?"
  documentos_esperados: [sii-uso-credito-fiscal, sii-faq-fe-6597, sii-faq-fe-6603]
  hechos_clave: [["acuse de recibo"]]
  tipo: normal
  verificado_en: "sii-uso-credito-fiscal: 'las facturas que dan derecho a utilizar el crédito fiscal, son aquellas que tienen Acuse de Recibo'"

- id: n02
  pregunta: "Si no acepto ni reclamo una factura, ¿qué pasa después?"
  documentos_esperados: [sii-uso-credito-fiscal, sii-faq-fe-6597, sii-faq-fe-6976]
  hechos_clave: [["8 días", "ocho días"], ["automátic"]]
  tipo: normal
  verificado_en: "sii-uso-credito-fiscal: 'se da automáticamente al cabo de los 8 días corridos desde que la factura es recepcionada por el SII'"

- id: n03
  pregunta: "¿Cuántos días tengo para reclamar una factura que me llegó mal?"
  documentos_esperados: [ley-19983, sii-uso-credito-fiscal, sii-faq-fe-6603]
  hechos_clave: [["8 días", "ocho días"]]
  tipo: normal
  verificado_en: "ley-19983 art. 3: 'dentro de los ocho días corridos siguientes a su recepción'"

- id: n04
  pregunta: "Una factura entró al SII el 28 de septiembre. ¿En qué mes queda con acuse de recibo automático?"
  documentos_esperados: [sii-uso-credito-fiscal]
  hechos_clave: [["mes siguiente", "octubre"]]
  tipo: normal
  verificado_en: "sii-uso-credito-fiscal: 'facturas recibidas en el SII los últimos 8 días del mes, tendrán su acuse de recibo automático al mes siguiente'"

- id: n05
  pregunta: "Reclamé una factura porque el monto venía malo. ¿Puedo usar igual su IVA crédito?"
  documentos_esperados: [sii-uso-credito-fiscal, sii-faq-fe-6915, sii-faq-fe-6295]
  hechos_clave: [["no da derecho", "no podrá hacer uso", "no tiene derecho"], ["crédito fiscal"]]
  tipo: normal
  verificado_en: "sii-faq-fe-6915: 'el receptor no podrá hacer uso del crédito fiscal contenido en la factura electrónica'"

- id: n06
  pregunta: "Reclamé una factura por error. ¿La puedo aceptar después?"
  documentos_esperados: [sii-faq-fe-6295]
  hechos_clave: [["no se puede cambiar", "no puede cambiar", "solo considera la primera"]]
  tipo: normal
  verificado_en: "sii-faq-fe-6295: 'posteriormente no se puede cambiar de estado a Aceptada'"

- id: n07
  pregunta: "¿Qué opciones tengo en el SII para aceptar o rechazar una factura que recibí?"
  documentos_esperados: [sii-uso-credito-fiscal]
  hechos_clave: [["acuse de recibo"], ["reclamo"]]
  tipo: normal
  verificado_en: "sii-uso-credito-fiscal: 5 alternativas (acuse de recibo, reclamo al contenido, falta parcial, falta total, acepta contenido)"

- id: n08
  pregunta: "Mi cliente reclamó una factura que le emití. ¿Igual la puedo pasar a factoring?"
  documentos_esperados: [sii-faq-fe-6915]
  hechos_clave: [["rechazará", "no se podrá ceder", "no podrá ceder"], ["cesión", "ceder"]]
  tipo: normal
  verificado_en: "sii-faq-fe-6915: 'el Registro Público Electrónico de Transferencia de Créditos rechazará las anotaciones de cesión electrónica que se efectúen con posterioridad al reclamo'"

- id: n09
  pregunta: "Me llegó atrasada una factura emitida en agosto. ¿Hasta cuándo puedo usar ese crédito fiscal?"
  documentos_esperados: [sii-faq-impuestos-mensuales-0693, dl825-ley-iva]
  hechos_clave: [["dos períodos", "2 períodos"], ["octubre"]]
  tipo: normal
  verificado_en: "sii-faq-impuestos-mensuales-0693: 'dentro de los dos períodos tributarios siguientes ... Agosto ... hasta Octubre'"

- id: n10
  pregunta: "¿Cuál es la tasa del IVA en Chile?"
  documentos_esperados: [dl825-ley-iva]
  hechos_clave: [["19%", "19 %", "diecinueve"]]
  tipo: normal
  verificado_en: "dl825-ley-iva art. 14: 'pagarán el impuesto con una tasa de 19% sobre la base imponible'"

- id: n11
  pregunta: "¿Qué compras me dan derecho a usar el IVA como crédito fiscal?"
  documentos_esperados: [dl825-ley-iva]
  hechos_clave: [["giro", "actividad"]]
  tipo: normal
  verificado_en: "dl825-ley-iva art. 23 N°1: 'gastos de tipo general, que digan relación con el giro o actividad del contribuyente'"

- id: n12
