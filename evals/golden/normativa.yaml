  documentos_esperados: [dl825-ley-iva]
  hechos_clave: [["nota de crédito", "notas de crédito"]]
  tipo: normal
  verificado_en: "dl825-ley-iva art. 57: 'deberán emitir notas de crédito por los descuentos o bonificaciones otorgados con posterioridad a la facturación'"

